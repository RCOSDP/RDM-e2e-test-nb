      run: |
        mkdir -p ../result/s3-rollback/institutional
        papermill テスト手順-S3移行後.ipynb ../result/s3-rollback/institutional/テスト手順-S3ロールバック.ipynb \
          -p rdm_url http://192.168.168.167:5000/ -p idp_name_1 FakeCAS \
