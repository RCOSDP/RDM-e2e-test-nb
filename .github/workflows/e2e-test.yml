name: E2E Test Execution

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      rdm_repository:
        description: 'RDM-osf.io repository (default: RCOSDP/RDM-osf.io)'
        required: false
        default: 'RCOSDP/RDM-osf.io'
      rdm_branch:
        description: 'RDM-osf.io branch to test against'
        required: false
        default: 'develop'
      merge_custom_rdm:
        description: 'Merge custom RDM branch into base branch before testing'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      osf_image:
        description: 'Base image for the shared Wiki-enabled OSF image (default: build the RDM Dockerfile)'
        required: false
        default: ''
      ember_image:
        description: 'Custom Ember image (default: niicloudoperation/rdm-ember-osf-web:latest)'
        required: false
        default: ''
      cas_image:
        description: 'Real CAS image; overrides CAS source settings for Shibboleth tests (not FakeCAS)'
        required: false
        default: ''
      cas_source:
        description: 'Shibboleth login CAS source as owner/repo@ref (default: RCOSDP/RDM-cas-overlay@develop)'
        required: false
        default: ''
      sp_source:
        description: 'Shibboleth SP source as owner/repo@ref (default: RCOSDP/RDM-Shibboleth-SP@main)'
        required: false
        default: ''
      mfr_image:
        description: 'Custom MFR image (default: niicloudoperation/rdm-modular-file-renderer:latest)'
        required: false
        default: ''
      wb_image:
        description: 'Custom WaterButler image (default: niicloudoperation/rdm-waterbutler:latest)'
        required: false
        default: ''
      wb_repository:
        description: 'RDM-waterbutler repository (default: RCOSDP/RDM-waterbutler)'
        required: false
        default: ''
      wb_branch:
        description: 'RDM-waterbutler branch to build and test against'
        required: false
        default: ''
      tljh_version:
        description: 'TLJH version (default: 1.0.0)'
        required: false
        default: ''
      tljh_plugin:
        description: 'tljh-repo2docker plugin (default: RCOSDP/CS-tljh-repo2docker@master)'
        required: false
        default: ''
      tljh_repo2docker_image:
        description: 'repo2docker Docker image (default: gcr.io/nii-ap-ops/repo2docker:2026.10.0)'
        required: false
        default: ''
      tljh_rdmfs_image:
        description: 'RDMFS Docker image (default: gcr.io/nii-ap-ops/rdmfs:2026.02.1)'
        required: false
        default: ''
      binderhub_image:
        description: 'BinderHub image (default: gcr.io/nii-ap-ops/k8s-binderhub-binderhub:0.2.5-20261111)'
        required: false
        default: ''
      binderhub_jupyterhub_image:
        description: 'JupyterHub image for the BinderHub tests (default: gcr.io/nii-ap-ops/k8s-hub:4.1.0-20261106)'
        required: false
        default: ''
      binderhub_source:
        description: 'Build the BinderHub image from owner/repo@branch (e.g. RCOSDP/CS-binderhub@master)'
        required: false
        default: ''
      binderhub_jupyterhub_source:
        description: 'Install JupyterHub for the BinderHub tests from owner/repo@branch (e.g. RCOSDP/CS-jupyterhub@master)'
        required: false
        default: ''
      enable_wiki:
        description: 'Run the Wiki E2E notebooks in all matrix jobs'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_wiki_collaboration:
        description: 'Skip the Wiki tests that edit the same page in two tabs'
        required: false
        default: true
        type: boolean
      wiki_source:
        description: 'Wiki frontend source as owner/repo@branch-or-tag (default: RCOSDP/RDM-wiki-frontend@develop)'
        required: false
        default: ''
      y_websocket_source:
        description: 'Wiki y-websocket source as owner/repo@branch-or-tag (default: RCOSDP/RDM-y-websocket@master)'
        required: false
        default: ''
      skip_failed:
        description: 'Continue running tests even if some fail'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  BINDERHUB_DEFAULT_IMAGE: gcr.io/nii-ap-ops/k8s-binderhub-binderhub:0.2.5-20261111
  BINDERHUB_DEFAULT_JUPYTERHUB_IMAGE: gcr.io/nii-ap-ops/k8s-hub:4.1.0-20261106

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      wb_custom: ${{ steps.wb_params.outputs.branch != '' }}
      rdm_repository: ${{ steps.rdm_config.outputs.repository }}
      rdm_base_sha: ${{ steps.rdm_target.outputs.base_sha }}
      rdm_target_sha: ${{ steps.rdm_target.outputs.target_sha }}
      osf_image: ${{ steps.osf_image.outputs.tag }}
      osf_image_id: ${{ steps.osf_image.outputs.image_id }}
      binderhub_custom: ${{ steps.binderhub_params.outputs.binderhub_source != '' }}
      binderhub_jupyterhub_custom: ${{ steps.binderhub_params.outputs.jupyterhub_source != '' }}

      y_websocket_repository: ${{ steps.source_params.outputs.y_websocket_repository }}
      y_websocket_branch: ${{ steps.source_params.outputs.y_websocket_branch }}
      shibboleth_cas_image: ${{ steps.source_params.outputs.cas_image || 'rdm-cas:shibboleth' }}
    steps:
    - name: Checkout test repository
      uses: actions/checkout@v4
      with:
        path: e2e-tests

    - name: Determine RDM repository and branch
      id: rdm_config
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        INPUT_REPO: ${{ inputs.rdm_repository }}
        INPUT_BRANCH: ${{ inputs.rdm_branch }}
        INPUT_MERGE: ${{ inputs.merge_custom_rdm }}
      run: |
        BASE_REPO="RCOSDP/RDM-osf.io"
        BASE_BRANCH="develop"
        CUSTOM_REPO=""
        CUSTOM_BRANCH=""
        MERGE_REQUIRED="false"
        MERGE_FLAG="true"
        TARGET_REPO="$BASE_REPO"
        TARGET_BRANCH="$BASE_BRANCH"

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          printf '%s\n' "$PR_BODY" > /tmp/pr_body.txt
          RDM_REPO=$(grep -oP '^-\s*RDM_REPOSITORY:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          RDM_BRANCH=$(grep -oP '^-\s*RDM_BRANCH:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          RDM_MERGE=$(grep -oP '^-\s*RDM_MERGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' | tr '[:upper:]' '[:lower:]' || true)

          if [[ -n "$RDM_MERGE" ]]; then
            case "$RDM_MERGE" in
              false|no|off)
                MERGE_FLAG="false"
                ;;
              true|yes|on)
                MERGE_FLAG="true"
                ;;
            esac
          fi

          if [[ -n "$RDM_REPO" || -n "$RDM_BRANCH" ]]; then
            CUSTOM_REPO="${RDM_REPO:-$BASE_REPO}"
            CUSTOM_BRANCH="${RDM_BRANCH:-$BASE_BRANCH}"
          fi
        else
          # Use workflow inputs or defaults

          if [[ -n "$INPUT_MERGE" ]]; then
            INPUT_MERGE=$(echo "$INPUT_MERGE" | tr '[:upper:]' '[:lower:]')
            case "$INPUT_MERGE" in
              false|no|off)
                MERGE_FLAG="false"
                ;;
              true|yes|on)
                MERGE_FLAG="true"
                ;;
            esac
          fi

          if [[ -n "$INPUT_REPO" || -n "$INPUT_BRANCH" ]]; then
            CUSTOM_REPO="${INPUT_REPO:-$BASE_REPO}"
            CUSTOM_BRANCH="${INPUT_BRANCH:-$BASE_BRANCH}"
          fi
        fi

        if [[ -n "$CUSTOM_REPO" || -n "$CUSTOM_BRANCH" ]]; then
          CUSTOM_REPO="${CUSTOM_REPO:-$BASE_REPO}"
          CUSTOM_BRANCH="${CUSTOM_BRANCH:-$BASE_BRANCH}"

          if [[ "$MERGE_FLAG" == "true" ]]; then
            MERGE_REQUIRED="true"
          else
            TARGET_REPO="$CUSTOM_REPO"
            TARGET_BRANCH="$CUSTOM_BRANCH"
          fi
        fi

        echo "Base RDM repository: $BASE_REPO @ $BASE_BRANCH"
        if [[ "$MERGE_REQUIRED" == "true" ]]; then
          echo "Merging custom RDM source: $CUSTOM_REPO @ $CUSTOM_BRANCH"
        elif [[ -n "$CUSTOM_REPO" || -n "$CUSTOM_BRANCH" ]]; then
          echo "Using custom RDM source without merge: $CUSTOM_REPO @ $CUSTOM_BRANCH"
        fi
        echo "Checkout target: $TARGET_REPO @ $TARGET_BRANCH"

        echo "repository=$TARGET_REPO" >> $GITHUB_OUTPUT
        echo "branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
        echo "custom_repository=$CUSTOM_REPO" >> $GITHUB_OUTPUT
        echo "custom_branch=$CUSTOM_BRANCH" >> $GITHUB_OUTPUT
        echo "merge_required=$MERGE_REQUIRED" >> $GITHUB_OUTPUT

    - name: Checkout RDM-osf.io
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.rdm_config.outputs.repository }}
        ref: ${{ steps.rdm_config.outputs.branch }}
        path: RDM-osf.io
        fetch-depth: 0

    - name: Prepare shared RDM target
      id: rdm_target
      working-directory: RDM-osf.io
      env:
        BASE_REPO: ${{ steps.rdm_config.outputs.repository }}
        CUSTOM_REPO: ${{ steps.rdm_config.outputs.custom_repository }}
        CUSTOM_BRANCH: ${{ steps.rdm_config.outputs.custom_branch }}
        MERGE_REQUIRED: ${{ steps.rdm_config.outputs.merge_required }}
      run: |
        BASE_SHA=$(git rev-parse HEAD)
        if [[ "$MERGE_REQUIRED" == "true" ]]; then
          if [[ "$CUSTOM_REPO" == "$BASE_REPO" ]]; then
            remote=origin
          else
            remote="https://github.com/${CUSTOM_REPO}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "RDM-e2e-test-nb@example.com"
          git fetch -- "$remote" "$CUSTOM_BRANCH"
          git merge --no-ff --no-commit FETCH_HEAD
          if ! git diff --quiet --cached; then
            git commit --no-verify -m "Temporary merge of ${CUSTOM_REPO}@${CUSTOM_BRANCH} for E2E tests"
          fi
        fi

        TARGET_SHA=$(git rev-parse HEAD)
        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
        if [[ "$TARGET_SHA" != "$BASE_SHA" ]]; then
          mkdir -p ../prebuilt-images
          git branch e2e-target "$TARGET_SHA"
          git bundle create ../prebuilt-images/rdm-target.bundle refs/heads/e2e-target "^$BASE_SHA"
        fi

    - name: Build Elasticsearch image with Kuromoji (amd64)
      working-directory: e2e-tests
      run: |
        docker build -t elasticsearch-kuromoji:amd64 \
          -f docker/elasticsearch/Dockerfile.amd64 docker/elasticsearch
        mkdir -p ../prebuilt-images
        docker save -o ../prebuilt-images/elasticsearch-kuromoji.tar elasticsearch-kuromoji:amd64

    - name: Build MinIO images from source
      working-directory: e2e-tests
      run: |
        docker build -t minio-source:local -f docker/minio/Dockerfile.minio docker/minio
        docker build -t minio-mc-source:local -f docker/minio/Dockerfile.mc docker/minio
        docker save -o ../prebuilt-images/minio.tar minio-source:local minio-mc-source:local

    - name: Parse WaterButler parameters
      id: wb_params
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          printf '%s\n' "$PR_BODY" > /tmp/pr_body.txt
          echo "repository=$(grep -oP '^-\s*WB_REPOSITORY:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)" >> $GITHUB_OUTPUT
          echo "branch=$(grep -oP '^-\s*WB_BRANCH:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)" >> $GITHUB_OUTPUT
        else
          echo "repository=${{ github.event.inputs.wb_repository }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.inputs.wb_branch }}" >> $GITHUB_OUTPUT
        fi

    - name: Build custom WaterButler image
      if: steps.wb_params.outputs.branch != ''
      run: |
        WB_REPO="${{ steps.wb_params.outputs.repository || 'RCOSDP/RDM-waterbutler' }}"
        WB_BRANCH="${{ steps.wb_params.outputs.branch }}"
        WB_BASE_BRANCH="develop"

        echo "Building custom WaterButler image from ${WB_REPO}@${WB_BRANCH}"

        # Clone base branch
        git clone --depth=50 -b "$WB_BASE_BRANCH" "https://github.com/${WB_REPO}.git" RDM-waterbutler
        cd RDM-waterbutler

        # Merge custom branch
        git fetch origin "$WB_BRANCH"
        git config user.name "github-actions[bot]"
        git config user.email "RDM-e2e-test-nb@example.com"
        git merge --no-ff FETCH_HEAD -m "Merge ${WB_BRANCH} for E2E tests"

        # Build Docker image
        docker build -t rdm-waterbutler:custom .
        cd ..
        docker save -o prebuilt-images/rdm-waterbutler-custom.tar rdm-waterbutler:custom

    - name: Parse CAS, SP and Wiki source parameters
      id: source_params
      run: |
        python3 - <<'PY'
        import json
        import os
        import re

        with open(os.environ['GITHUB_EVENT_PATH']) as source:
            event = json.load(source)
        if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
            parameters = dict(re.findall(
                r'^-[ \t]*(CAS_IMAGE|(?:CAS|SP|WIKI|Y_WEBSOCKET)_(?:REPOSITORY|BRANCH)):[ \t]*([^\r\n]*)',
                event['pull_request']['body'] or '', re.MULTILINE))
        elif os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
            inputs = event['inputs']
            parameters = {'CAS_IMAGE': inputs.get('cas_image', '')}
            for service in ('cas', 'sp', 'wiki', 'y_websocket'):
                source = inputs.get(f'{service}_source', '').strip()
                if source:
                    match = re.fullmatch(r'([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([^\s]+)', source)
                    if not match:
                        raise ValueError(f'{service}_source must be owner/repo@ref')
                    parameters[f'{service.upper()}_REPOSITORY'], parameters[f'{service.upper()}_BRANCH'] = match.groups()
        else:
            parameters = {}
        defaults = {
            'CAS_IMAGE': '',
            'CAS_REPOSITORY': 'RCOSDP/RDM-cas-overlay',
            'CAS_BRANCH': 'develop',
            'SP_REPOSITORY': 'RCOSDP/RDM-Shibboleth-SP',
            'SP_BRANCH': 'main',
            'WIKI_REPOSITORY': 'RCOSDP/RDM-wiki-frontend',
            'WIKI_BRANCH': 'develop',
            'Y_WEBSOCKET_REPOSITORY': 'RCOSDP/RDM-y-websocket',
            'Y_WEBSOCKET_BRANCH': 'master',
        }
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key, default in defaults.items():
                value = parameters.get(key, '').strip() or default
                print(f'{key.lower()}={value}', file=output)
        PY

    - name: Build shared Wiki-enabled OSF image
      id: osf_image
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        WIKI_REPO: ${{ steps.source_params.outputs.wiki_repository }}
        WIKI_BRANCH: ${{ steps.source_params.outputs.wiki_branch }}
        OSF_BASE_IMAGE: ${{ inputs.osf_image }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          OSF_BASE_IMAGE=$(grep -m1 -oP '^-\s*OSF_IMAGE:\s*\K.*$' <<< "$PR_BODY" | tr -d ' \r' || true)
        fi

        git clone --depth=1 --branch "$WIKI_BRANCH" -- "https://github.com/${WIKI_REPO}.git" RDM-wiki-frontend
        echo "Wiki frontend commit: $(git -C RDM-wiki-frontend rev-parse HEAD)"
        cp -a RDM-osf.io wiki-osf
        cp -a RDM-wiki-frontend/. wiki-osf/
        docker build --pull -t rdm-wiki-bundle:ci wiki-osf/

        mkdir -p wiki-output prebuilt-images/wiki
        container=$(docker create rdm-wiki-bundle:ci bash)
        trap 'docker rm -f "$container" >/dev/null' EXIT
        docker cp "$container:/code/website/static/public/js/." wiki-output/
        docker rm "$container"
        trap - EXIT
        docker image rm rdm-wiki-bundle:ci

        bundles=(wiki-output/wiki-edit-page.*.js)
        if [[ "${#bundles[@]}" != 1 || ! -f "${bundles[0]}" ]]; then
          echo "Expected one built Wiki bundle" >&2
          exit 1
        fi
        cp "${bundles[0]}" prebuilt-images/wiki/wiki-edit-page.js
        if [[ -f "${bundles[0]}.map" ]]; then
          cp "${bundles[0]}.map" prebuilt-images/wiki/
        fi
        # The target checkout is also mounted into /code by the E2E Compose stack.
        cp -r prebuilt-images/wiki/. RDM-osf.io/website/static/js/pages/

        image=rdm-osf-wiki:ci
        if [[ -n "$OSF_BASE_IMAGE" ]]; then
          docker build --pull --build-arg "OSF_BASE_IMAGE=$OSF_BASE_IMAGE" -t "$image" -f - prebuilt-images/wiki <<'DOCKERFILE'
        ARG OSF_BASE_IMAGE
        FROM ${OSF_BASE_IMAGE}
        COPY . /code/website/static/js/pages/
        DOCKERFILE
        else
          docker build -t "$image" RDM-osf.io/
        fi
        image_id=$(docker image inspect --format '{{.Id}}' "$image")
        docker image save "$image" | gzip -1 > prebuilt-images/rdm-osf-wiki.tar.gz
        echo "tag=$image" >> "$GITHUB_OUTPUT"
        echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

    - name: Parse BinderHub source parameters
      id: binderhub_params
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          printf '%s\n' "$PR_BODY" > /tmp/pr_body.txt
          echo "binderhub_source=$(grep -oP '^-\s*BINDERHUB_SOURCE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)" >> $GITHUB_OUTPUT
          echo "jupyterhub_source=$(grep -oP '^-\s*BINDERHUB_JUPYTERHUB_SOURCE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)" >> $GITHUB_OUTPUT
        else
          echo "binderhub_source=${{ github.event.inputs.binderhub_source }}" >> $GITHUB_OUTPUT
          echo "jupyterhub_source=${{ github.event.inputs.binderhub_jupyterhub_source }}" >> $GITHUB_OUTPUT
        fi

    - name: Build custom BinderHub image
      if: steps.binderhub_params.outputs.binderhub_source != ''
      run: |
        BINDERHUB_SOURCE="${{ steps.binderhub_params.outputs.binderhub_source }}"
        BINDERHUB_REPO="${BINDERHUB_SOURCE%@*}"
        BINDERHUB_BRANCH="${BINDERHUB_SOURCE#*@}"
        echo "Building custom BinderHub image from ${BINDERHUB_REPO}@${BINDERHUB_BRANCH}"
        git clone --depth=1 -b "$BINDERHUB_BRANCH" "https://github.com/${BINDERHUB_REPO}.git" CS-binderhub
        cd CS-binderhub
        # Same steps as the chartpress build of the deployed image
        python3 -m pip install build
        python3 -m build --wheel .
        docker build -f helm-chart/images/binderhub/Dockerfile -t binderhub:custom .
        cd ..
        docker save -o prebuilt-images/binderhub-custom.tar binderhub:custom

    - name: Build custom JupyterHub image for BinderHub tests
      if: steps.binderhub_params.outputs.jupyterhub_source != ''
      run: |
        JUPYTERHUB_SOURCE="${{ steps.binderhub_params.outputs.jupyterhub_source }}"
        JUPYTERHUB_REPO="${JUPYTERHUB_SOURCE%@*}"
        JUPYTERHUB_BRANCH="${JUPYTERHUB_SOURCE#*@}"
        echo "Building custom JupyterHub image from ${JUPYTERHUB_REPO}@${JUPYTERHUB_BRANCH}"
        git clone --depth=1 -b "$JUPYTERHUB_BRANCH" "https://github.com/${JUPYTERHUB_REPO}.git" CS-jupyterhub
        docker build -f e2e-tests/docker/binderhub/Dockerfile.jupyterhub-source \
          --build-arg JUPYTERHUB_IMAGE="$BINDERHUB_DEFAULT_JUPYTERHUB_IMAGE" \
          -t binderhub-jupyterhub:custom CS-jupyterhub
        docker save -o prebuilt-images/binderhub-jupyterhub-custom.tar binderhub-jupyterhub:custom

    - name: Checkout CAS source
      if: steps.source_params.outputs.cas_image == ''
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.source_params.outputs.cas_repository }}
        ref: ${{ steps.source_params.outputs.cas_branch }}
        path: RDM-cas-overlay

    - name: Checkout Shibboleth SP source
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.source_params.outputs.sp_repository }}
        ref: ${{ steps.source_params.outputs.sp_branch }}
        path: RDM-Shibboleth-SP

    - name: Build Shibboleth authentication images
      env:
        CAS_IMAGE: ${{ steps.source_params.outputs.cas_image }}
        CAS_REPOSITORY: ${{ steps.source_params.outputs.cas_repository }}
        SP_REPOSITORY: ${{ steps.source_params.outputs.sp_repository }}
      run: |
        mkdir -p shibboleth-images
        images=(rdm-sp:shibboleth rdm-idp:shibboleth)
        if [[ -n "$CAS_IMAGE" ]]; then
          printf 'CAS_IMAGE=%s\n' "$CAS_IMAGE" > shibboleth-images/revisions.txt
        else
          docker build --target dist -t rdm-cas:shibboleth RDM-cas-overlay
          images+=(rdm-cas:shibboleth)
          printf 'CAS_SOURCE=%s@%s\n' "$CAS_REPOSITORY" "$(git -C RDM-cas-overlay rev-parse HEAD)" > shibboleth-images/revisions.txt
        fi
        docker build -t rdm-sp:shibboleth RDM-Shibboleth-SP
        docker build -t rdm-idp:shibboleth e2e-tests/docker/shibboleth/idp
        docker save -o shibboleth-images/authentication.tar "${images[@]}"
        printf 'SP_SOURCE=%s@%s\n' "$SP_REPOSITORY" "$(git -C RDM-Shibboleth-SP rev-parse HEAD)" >> shibboleth-images/revisions.txt

    - name: Upload Shibboleth authentication images
      uses: actions/upload-artifact@v4
      with:
        name: shibboleth-images
        path: shibboleth-images/
        retention-days: 7

    - name: Upload prebuilt images
      uses: actions/upload-artifact@v4
      with:
        name: prebuilt-images
        path: prebuilt-images/
        retention-days: 7

  e2e-test:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.test-group.timeout_minutes || 120 }}
    strategy:
      fail-fast: false
      matrix:
        test-group:
          - name: user
            display_name: "User Tests"
            include_admin: false
            skip_admin: true
            skip_metadata: false
            skip_autofill: true
            minio_enabled: false
            weko_enabled: false
            mibyo_db_enabled: false
            jupyterhub_enabled: false
            flowable_enabled: false
            wiki_enabled: false
            institutional_admin_authorization_enabled: false
            member_display_enabled: true
            mapcore_group_enabled: false
          - name: user-metadata
            display_name: "User Tests (Metadata)"
            include_admin: false
            skip_admin: true
            skip_metadata: false
            skip_autofill: false
            skip_default_storage: true
            skip_login: true
            skip_130mb_upload: true
            minio_enabled: false
            weko_enabled: false
            mibyo_db_enabled: false
            jupyterhub_enabled: false
            flowable_enabled: false
            wiki_enabled: false
            institutional_admin_authorization_enabled: false
            member_display_enabled: false
            mapcore_group_enabled: false
          - name: admin
