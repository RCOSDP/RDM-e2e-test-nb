          -p new_file_name after-upgrade.txt -p default_result_path ../result/s3-after/institutional -p close_on_fail True

    - name: Verify upgraded S3 requests use SigV4
      if: env.S3_MIGRATION_ENABLED == 'true'
      working-directory: RDM-osf.io
      run: |
        log=../e2e-tests/result/s3-after/s3-minio-proxy.log
        docker-compose logs --no-color --no-log-prefix s3-minio-proxy > "$log"
        for bucket in s3-e2e-a s3-e2e-b; do
          if ! grep -Eq "^[^ ]+ (${bucket}\.[^ ]+ |[^ ]+ /${bucket}(/| ))[^[:cntrl:]]*signature=v4$" "$log"; then
            echo "No Signature V4 request recorded for ${bucket}" >&2
            exit 1
          fi
        done
        if grep -q 'signature=v2$' "$log"; then
          echo 'The upgraded version used Signature V2' >&2
          exit 1
        fi

    - name: Restore the migration source version
      if: env.S3_MIGRATION_ENABLED == 'true'
