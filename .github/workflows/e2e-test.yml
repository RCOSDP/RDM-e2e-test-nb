        # Dedicated user for groups tests
        idp_username_3: 'testuser6@example.com'
        idp_password_3: 'testpass666'
        idp_username_4: 'testuser4@example.com'
        idp_password_4: 'testpass654'
        idp_username_5: 'testuser5@example.com'
        idp_password_5: 'testpass987'
        display_username_institutional_admin: 'Staff'
        display_username_1: 'User 1'
        display_username_2: 'User 2'
        display_username_3: 'User 6'
        group_a: 'GroupA'
        group_b: 'GroupB'
        group_c: 'GroupC'
        group_d: 'GroupD'
        group_search: 'Group'
        group_note_text: '※本機能はムーンショット目標2'

        # Test project URLs (using created project IDs and names)
        rdm_project_url_1: 'http://192.168.168.167:5000/${{ env.PROJECT_ID_1 }}/'
        rdm_project_name_1: '${{ env.PROJECT_NAME_1 }}'
        rdm_project_url_2: 'http://192.168.168.167:5000/${{ env.PROJECT_ID_2 }}/'
        
        # Test settings for ${{ matrix.test-group.name }} group
        skip_failed_test: true  # Continue on failure
