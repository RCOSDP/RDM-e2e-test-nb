    name: E2E ${{ matrix.test-group.display_name }}
    env:
      SHIBBOLETH_ENABLED: ${{ matrix.test-group.shibboleth_enabled == true && 'true' || 'false' }}
      SHIBBOLETH_ROLE: ${{ matrix.test-group.shibboleth_role }}
      MINIO_ENABLED: ${{ matrix.test-group.minio_enabled == true && 'true' || 'false' }}
      S3_MINIO_ENABLED: ${{ matrix.test-group.s3_minio_enabled == true && 'true' || 'false' }}
      S3_MINIO_INST_ENABLED: ${{ matrix.test-group.s3_minio_institutional == true && 'true' || 'false' }}
      S3_MIGRATION_ENABLED: ${{ matrix.test-group.s3_migration == true && 'true' || 'false' }}
      S3COMPATSIGV4_ENABLED: ${{ matrix.test-group.s3compatsigv4_enabled == true && 'true' || 'false' }}
      S3COMPATSIGV4_INST_ENABLED: ${{ matrix.test-group.s3compatsigv4_institutional_storage == true && 'true' || 'false' }}
      WEKO_ENABLED: ${{ matrix.test-group.weko_enabled == true && 'true' || 'false' }}
      BINDERHUB_ENABLED: ${{ matrix.test-group.binderhub_enabled == true && 'true' || 'false' }}
      JUPYTERHUB_ENABLED: ${{ matrix.test-group.jupyterhub_enabled == true && 'true' || 'false' }}
      FLOWABLE_ENABLED: ${{ matrix.test-group.flowable_enabled == true && 'true' || 'false' }}
      MIBYO_DB_ENABLED: ${{ matrix.test-group.mibyo_db_enabled == true && 'true' || 'false' }}
      WIKI_ENABLED: ${{ (matrix.test-group.wiki_enabled == true || github.event.inputs.enable_wiki == 'true') && 'true' || 'false' }}
      INSTITUTIONAL_ADMIN_AUTHORIZATION_ENABLED: ${{ matrix.test-group.institutional_admin_authorization_enabled == true && 'true' || 'false' }}
      MAPCORE_GROUP_ENABLED: ${{ matrix.test-group.mapcore_group_enabled == true && 'true' || 'false' }}
      MINIO_ROOT_USER: e2eadmin
      MINIO_ROOT_PASSWORD: e2epassword123
      MINIO_ALIAS: ci-minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${{ matrix.test-group.minio_region || 'us-east-1' }}
      MINIO_SERVICE_NAME: MinIO (CI)

    steps:
    - name: Checkout test repository
      uses: actions/checkout@v4
      with:
        path: e2e-tests

    - name: Checkout RDM-osf.io
      uses: actions/checkout@v4
      with:
        repository: ${{ needs.build-images.outputs.rdm_repository }}
        ref: ${{ needs.build-images.outputs.rdm_base_sha }}
        path: RDM-osf.io
        fetch-depth: 0

    - name: Checkout Flowable gateway repository
      if: env.FLOWABLE_ENABLED == 'true'
      uses: actions/checkout@v4
      with:
        repository: RCOSDP/RDM-flowable-gateway
        path: RDM-flowable-gateway

    - name: Prepare FakeWEKO
      if: env.WEKO_ENABLED == 'true' || env.MIBYO_DB_ENABLED == 'true'
      run: |
        for role in ADMIN USER; do
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "WEKO_${role}_PASSWORD=$password" >> "$GITHUB_ENV"
        done
        cp -r e2e-tests/docker/fakeweko weko
        mkdir -p weko/nginx/keys
        openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
          -keyout weko/nginx/keys/server.key -out weko/nginx/keys/server.crt \
          -subj '/CN=192.168.168.167' -addext 'subjectAltName=IP:192.168.168.167,IP:127.0.0.1'

    - name: Prepare Flowable gateway
      if: env.FLOWABLE_ENABLED == 'true'
      working-directory: e2e-tests
      run: |
        .github/scripts/setup_flowable.sh prepare ../RDM-flowable-gateway ../RDM-osf.io

    - name: Configure Docker to use /mnt
      run: |
        # Stop Docker service
        sudo systemctl stop docker
        
        # Create Docker data directory on /mnt
        sudo mkdir -p /mnt/docker
        
        # Configure Docker to use /mnt
        sudo tee /etc/docker/daemon.json <<EOF
        {
          "data-root": "/mnt/docker"
        }
        EOF
        
        # Start Docker service
        sudo systemctl start docker
        
        # Verify Docker is using /mnt
        docker info | grep "Docker Root Dir"
        df -h

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Download prebuilt images
      uses: actions/download-artifact@v4
      with:
        name: prebuilt-images
        path: prebuilt-images

    - name: Restore shared RDM target
      working-directory: RDM-osf.io
      env:
        RDM_BASE_SHA: ${{ needs.build-images.outputs.rdm_base_sha }}
        RDM_TARGET_SHA: ${{ needs.build-images.outputs.rdm_target_sha }}
      run: |
        if [[ "$RDM_TARGET_SHA" != "$RDM_BASE_SHA" ]]; then
          git fetch "$GITHUB_WORKSPACE/prebuilt-images/rdm-target.bundle" refs/heads/e2e-target
        fi
        git checkout -B e2e-target "$RDM_TARGET_SHA"

    - name: Load prebuilt images
      env:
        TARGET_OSF_IMAGE: ${{ needs.build-images.outputs.osf_image }}
        TARGET_OSF_IMAGE_ID: ${{ needs.build-images.outputs.osf_image_id }}
      run: |
        docker image load -i prebuilt-images/rdm-osf-wiki.tar.gz
        test "$(docker image inspect --format '{{.Id}}' "$TARGET_OSF_IMAGE")" = "$TARGET_OSF_IMAGE_ID"
        echo "Shared OSF image: $TARGET_OSF_IMAGE_ID"
        mv prebuilt-images/wiki wiki-bundle
        docker load -i prebuilt-images/elasticsearch-kuromoji.tar
        echo "ELASTICSEARCH_IMAGE=elasticsearch-kuromoji:amd64" >> "$GITHUB_ENV"

        if [ "${MINIO_ENABLED}" = "true" ]; then
          docker load -i prebuilt-images/minio.tar
          echo "MINIO_IMAGE=minio-source:local" >> "$GITHUB_ENV"
          echo "MINIO_MC_IMAGE=minio-mc-source:local" >> "$GITHUB_ENV"
        fi

        if [ "${{ needs.build-images.outputs.wb_custom }}" = "true" ]; then
          docker load -i prebuilt-images/rdm-waterbutler-custom.tar
          echo "WB_IMAGE=rdm-waterbutler:custom" >> "$GITHUB_ENV"
        fi

        if [ "${BINDERHUB_ENABLED}" = "true" ] && [ "${{ needs.build-images.outputs.binderhub_custom }}" = "true" ]; then
          docker load -i prebuilt-images/binderhub-custom.tar
          echo "BINDERHUB_CUSTOM_IMAGE=binderhub:custom" >> "$GITHUB_ENV"
        fi
        if [ "${BINDERHUB_ENABLED}" = "true" ] && [ "${{ needs.build-images.outputs.binderhub_jupyterhub_custom }}" = "true" ]; then
          docker load -i prebuilt-images/binderhub-jupyterhub-custom.tar
          echo "BINDERHUB_CUSTOM_JUPYTERHUB_IMAGE=binderhub-jupyterhub:custom" >> "$GITHUB_ENV"
        fi
        rm -rf prebuilt-images

    - name: Download Shibboleth authentication images
      if: env.SHIBBOLETH_ENABLED == 'true'
      uses: actions/download-artifact@v4
      with:
        name: shibboleth-images
        path: shibboleth-images

    - name: Load Shibboleth authentication images
      if: env.SHIBBOLETH_ENABLED == 'true'
      run: |
        docker load -i shibboleth-images/authentication.tar
        mkdir -p e2e-tests/result
        mv shibboleth-images/revisions.txt e2e-tests/result/authentication-revisions.txt
        rm -r shibboleth-images

    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Setup host networking alias
      run: |
        # Add loopback alias for Ubuntu as per README-docker-compose.md
        sudo ifconfig lo:0 192.168.168.167 netmask 255.255.255.255 up

    - name: Setup migration source (migration mode)
      if: matrix.test-group.migration_from != null
      working-directory: RDM-osf.io
      run: |
        # Fetch origin to ensure we have the target version
        git fetch origin

        # Add migration source repository as remote if different
        if [ "${{ matrix.test-group.migration_from.repository }}" != "${{ needs.build-images.outputs.rdm_repository }}" ]; then
          git remote add migration-source https://github.com/${{ matrix.test-group.migration_from.repository }}.git
          git fetch migration-source
        fi

        # Checkout the migration source commit
        git checkout ${{ matrix.test-group.migration_from.commit }}

    - name: Setup initial environment for migration
      if: matrix.test-group.migration_from != null
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        
        # Setup configuration files
        export INCLUDE_ADMIN=${{ matrix.test-group.include_admin }}
        setup_config_files
        
        # Create docker-compose override with migration source images
        export OSF_IMAGE="${{ matrix.test-group.migration_from.osf_image }}"
        export EMBER_IMAGE="${{ matrix.test-group.migration_from.ember_image }}"
        export CAS_IMAGE="${{ matrix.test-group.migration_from.cas_image }}"
        export MFR_IMAGE="${{ matrix.test-group.migration_from.mfr_image }}"
        export WB_IMAGE="${{ matrix.test-group.migration_from.wb_image }}"
        if [ "${S3_MIGRATION_ENABLED}" = "true" ]; then
          git init "$RUNNER_TEMP/waterbutler-legacy"
          git -C "$RUNNER_TEMP/waterbutler-legacy" fetch --depth=1 https://github.com/RCOSDP/RDM-waterbutler.git "${{ matrix.test-group.migration_from.wb_commit }}"
          git -C "$RUNNER_TEMP/waterbutler-legacy" checkout --detach FETCH_HEAD
          docker build -t "$WB_IMAGE" "$RUNNER_TEMP/waterbutler-legacy"
        fi
        create_docker_override
        
        # Install requirements
        install_requirements
        
        # Run migrations
        run_migrations
        
        # Enable feature flags
        export FEATURE_FLAGS="ember_edit_draft_registration_page"
        enable_feature_flags
        
        # Compile translations
        compile_translations
        
        # Start asset services after translations
        start_asset_services
        
        # Start services for migration source environment
        start_rdm_services
        
        # Test endpoints
        test_rdm_endpoints

    - name: Initialize S3 storage for migration
      if: env.S3_MIGRATION_ENABLED == 'true'
      working-directory: RDM-osf.io
      run: |
        scripts="${{ github.workspace }}/e2e-tests/.github/scripts"
        "$scripts/setup_minio_buckets.sh" . "$MINIO_ALIAS" "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" \
          s3migrationa s3-fixture-secret-a s3-e2e-a s3migrationb s3-fixture-secret-b s3-e2e-b
        bash "$scripts/setup_s3_minio.sh" prepare "$PWD"
        S3_MIGRATION_LEGACY=true bash "$scripts/setup_s3_minio.sh" install "$PWD"

    - name: Set up Python for E2E tests
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install E2E test dependencies
      working-directory: e2e-tests
      run: |
        # Install without cache to save disk space
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-noto-cjk
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir papermill
        if [ "${S3_MINIO_ENABLED}" = "true" ] && [ "${S3_MINIO_INST_ENABLED}" != "true" ] && [ "${S3_MIGRATION_ENABLED}" != "true" ]; then
          pip install --no-cache-dir boto3
        fi
        
        # Clear pip cache if any remains
        pip cache purge || true

    - name: Setup Node.js for Playwright
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Playwright
      run: |
        # Install Playwright browsers with OS dependencies
        playwright install --with-deps chromium firefox

    - name: Create test data for migration source
      if: matrix.test-group.migration_from != null
      working-directory: RDM-osf.io
      run: |
        set -o pipefail
        echo "Creating test data in migration source environment..."

        # Setup institutions first (required for setup_test_data.py)
        docker-compose run --rm web python3 -m scripts.populate_institutions -e test -a

        # Copy the setup script to the container
        docker cp ${{ github.workspace }}/e2e-tests/.github/scripts/setup_test_data.py "$(docker-compose ps -q web)":/tmp/setup_test_data.py

        # Create test data that will be migrated
        docker-compose exec -T -e WIKI_ENABLED="${WIKI_ENABLED}" -e MAPCORE_GROUP_ENABLED="${MAPCORE_GROUP_ENABLED}" -e INSTITUTIONAL_ADMIN_AUTHORIZATION_ENABLED="${INSTITUTIONAL_ADMIN_AUTHORIZATION_ENABLED}" web bash -c "python3 manage.py shell < /tmp/setup_test_data.py"

        echo "Migration source test data created"

    - name: Run migration-specific initial data script
      if: matrix.test-group.migration_from.initial_data_script != null
      working-directory: RDM-osf.io
      run: |
        echo "Running migration-specific initial data script..."
        
        # Copy the migration-specific script to the container
        docker cp ${{ github.workspace }}/e2e-tests/migrations/${{ matrix.test-group.migration_from.initial_data_script }} "$(docker-compose ps -q web)":/tmp/migration_init.py
        
        # Execute the migration-specific initial data script
        docker-compose exec -T web bash -c "python3 manage.py shell < /tmp/migration_init.py"
        
        echo "Migration-specific initial data created"

    - name: Run migration-specific initial data notebook
      if: matrix.test-group.migration_from.initial_data_notebook != null
      working-directory: e2e-tests/migrations
      run: |
        echo "Running migration-specific initial data notebook..."
        
        # Create result directory for migration initial data
        mkdir -p ../result
        
        # Execute the notebook against the migration source environment
        papermill ${{ matrix.test-group.migration_from.initial_data_notebook }} \
          ../result/migration_initial_${{ matrix.test-group.migration_from.initial_data_notebook }} \
          -p rdm_url "http://192.168.168.167:5000/" \
          -p admin_rdm_url "http://192.168.168.167:8001/" \
          -p idp_name_1 "FakeCAS" \
          -p idp_username_1 "testuser1@example.com" \
          -p idp_password_1 "testpass123" \
          -p idp_name_2 "FakeCAS" \
          -p idp_username_2 "testuser2@example.com" \
          -p idp_password_2 "testpass456" \
          -p default_result_path "../result" \
          -p transition_timeout 60000
        
        echo "Migration-specific initial data notebook executed"

    - name: Run S3 migration source notebook
      if: env.S3_MIGRATION_ENABLED == 'true'
      working-directory: e2e-tests/migrations
      run: |
        mkdir -p ../result/s3-before
        papermill テスト手順-S3移行前.ipynb ../result/s3-before/テスト手順-S3移行前.ipynb \
          -p rdm_url http://192.168.168.167:5000/ -p idp_name_1 FakeCAS \
          -p idp_username_1 testuser1@example.com -p idp_password_1 testpass123 \
          -p s3_access_key s3migrationa -p s3_secret_key s3-fixture-secret-a -p s3_bucket s3-e2e-a \
          -p default_result_path ../result/s3-before -p close_on_fail True

    - name: Configure institutional S3 on the migration source
      if: env.S3_MIGRATION_ENABLED == 'true'
      working-directory: e2e-tests
      run: |
        mkdir -p result/s3-before/institutional
        papermill 取りまとめ-機関ストレージ.ipynb result/s3-before/institutional/取りまとめ-機関ストレージ.ipynb \
          -p rdm_url http://192.168.168.167:5000/ -p admin_rdm_url http://192.168.168.167:8001/ \
          -p idp_name_1 FakeCAS -p idp_username_1 teststaff@example.com -p idp_password_1 testpass789 \
          -p member_idp_username testuser2@example.com -p member_idp_password testpass456 \
          -p storage_provider s3 -p institutional_storage_name 'Institutional S3 Migration Storage' \
          -p s3_access_key s3migrationb -p s3_secret_key s3-fixture-secret-b -p s3_bucket s3-e2e-b \
          -p rdm_project_prefix TEST-Institutional-S3-Migration -p prepare_migration True \
          -p default_result_path result/s3-before/institutional -p close_on_fail True

    - name: Stop migration source environment
      if: matrix.test-group.migration_from != null
      working-directory: RDM-osf.io
      run: |
        echo "Stopping migration source environment..."
        if [ "${S3_MIGRATION_ENABLED}" = "true" ]; then
          docker-compose logs --no-color --no-log-prefix s3-minio-proxy > ../e2e-tests/result/s3-before/s3-minio-proxy.log
        fi
        docker-compose down
        echo "Migration source environment stopped"

    - name: Switch to migration target version
      if: matrix.test-group.migration_from != null
      working-directory: RDM-osf.io
      run: |
        echo "Switching to migration target version..."
        
        # Reset to the merged target state captured earlier
        git checkout -f e2e-target
        
        echo "Switched to target version: e2e-target"

    - name: Install shared Wiki bundle in the mounted RDM checkout
      working-directory: RDM-osf.io
      run: cp -r "$GITHUB_WORKSPACE/wiki-bundle/." website/static/js/pages/

    - name: Create required configuration files for RDM
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        
        # Setup configuration files
        export INCLUDE_ADMIN=${{ matrix.test-group.include_admin }}
        setup_config_files

    - name: Prepare OAuth BinderHub settings
      if: env.BINDERHUB_ENABLED == 'true'
      working-directory: e2e-tests
      run: .github/scripts/setup_binderhub.sh prepare ../RDM-osf.io

    - name: Parse PR body and workflow parameters
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          printf '%s\n' "$PR_BODY" > /tmp/pr_body.txt
          WIKI_ENABLED_OVERRIDE=$(grep -oP '^-\s*WIKI_ENABLED:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' | tr '[:upper:]' '[:lower:]' || true)
          if [[ "$WIKI_ENABLED_OVERRIDE" == "true" ]]; then
            echo "WIKI_ENABLED=true" >> $GITHUB_ENV
          fi

        fi

    - name: Build and start y-websocket
      if: env.WIKI_ENABLED == 'true'
      env:
        Y_WS_REPO: ${{ needs.build-images.outputs.y_websocket_repository }}
        Y_WS_BRANCH: ${{ needs.build-images.outputs.y_websocket_branch }}
      run: |
        git clone --depth=50 -b "${Y_WS_BRANCH}" "https://github.com/${Y_WS_REPO}.git" RDM-y-websocket
        docker build --pull -t rdm/y-websocket:local RDM-y-websocket
        docker compose -f e2e-tests/docker/y-websocket/docker-compose.yml up -d
        # Wait for y-websocket to become ready
        echo "Waiting for y-websocket to be ready..."
        for i in $(seq 1 30); do
          if nc -z localhost 1234 2>/dev/null; then
            echo "y-websocket is ready after ${i}s"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "ERROR: y-websocket did not become ready in time"
            docker compose -f e2e-tests/docker/y-websocket/docker-compose.yml logs
            exit 1
          fi
          sleep 1
        done
        echo "Y_WEBSOCKET_URL=ws://localhost:1234" >> $GITHUB_ENV
        echo "y-websocket started at ws://localhost:1234"

    - name: Create docker-compose override for NII Cloud Operation images
      working-directory: RDM-osf.io
      env:
        OSF_IMAGE: ${{ needs.build-images.outputs.osf_image }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        # Check for image override in PR body or use workflow inputs
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          printf '%s\n' "$PR_BODY" > /tmp/pr_body.txt
          EMBER_OVERRIDE=$(grep -oP '^-\s*EMBER_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' ' || true)
          CAS_OVERRIDE=$(grep -oP '^-\s*CAS_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' ' || true)
          MFR_OVERRIDE=$(grep -oP '^-\s*MFR_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' ' || true)
          WB_OVERRIDE=$(grep -oP '^-\s*WB_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' ' || true)
          EXCLUDE_NOTEBOOKS_OVERRIDE=$(grep -oP '^-\s*EXCLUDE_NOTEBOOKS:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d '\r' || true)

          # Extract TLJH parameters from PR body
          TLJH_VERSION_OVERRIDE=$(grep -oP '^-\s*TLJH_VERSION:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          TLJH_PLUGIN_OVERRIDE=$(grep -oP '^-\s*TLJH_PLUGIN:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          TLJH_REPO2DOCKER_IMAGE_OVERRIDE=$(grep -oP '^-\s*TLJH_REPO2DOCKER_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          TLJH_RDMFS_IMAGE_OVERRIDE=$(grep -oP '^-\s*TLJH_RDMFS_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          BINDERHUB_IMAGE_OVERRIDE=$(grep -oP '^-\s*BINDERHUB_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)
          BINDERHUB_JUPYTERHUB_IMAGE_OVERRIDE=$(grep -oP '^-\s*BINDERHUB_JUPYTERHUB_IMAGE:\s*\K.*$' /tmp/pr_body.txt | head -1 | tr -d ' \r' || true)

          # Export for use in later steps
          echo "EXCLUDE_NOTEBOOKS=$EXCLUDE_NOTEBOOKS_OVERRIDE" >> $GITHUB_ENV
          echo "TLJH_VERSION_OVERRIDE=$TLJH_VERSION_OVERRIDE" >> $GITHUB_ENV
          echo "TLJH_PLUGIN_OVERRIDE=$TLJH_PLUGIN_OVERRIDE" >> $GITHUB_ENV
          echo "TLJH_REPO2DOCKER_IMAGE_OVERRIDE=$TLJH_REPO2DOCKER_IMAGE_OVERRIDE" >> $GITHUB_ENV
          echo "TLJH_RDMFS_IMAGE_OVERRIDE=$TLJH_RDMFS_IMAGE_OVERRIDE" >> $GITHUB_ENV
          echo "BINDERHUB_IMAGE_OVERRIDE=$BINDERHUB_IMAGE_OVERRIDE" >> $GITHUB_ENV
          echo "BINDERHUB_JUPYTERHUB_IMAGE_OVERRIDE=$BINDERHUB_JUPYTERHUB_IMAGE_OVERRIDE" >> $GITHUB_ENV

          export EMBER_IMAGE="${EMBER_OVERRIDE:-niicloudoperation/rdm-ember-osf-web:latest}"
          export CAS_IMAGE="${CAS_OVERRIDE:-niicloudoperation/rdm-cas-overlay:latest}"
          export MFR_IMAGE="${MFR_OVERRIDE:-niicloudoperation/rdm-modular-file-renderer:latest}"
          if [[ -n "$WB_IMAGE" ]]; then
            export WB_IMAGE
          else
            export WB_IMAGE="${WB_OVERRIDE:-niicloudoperation/rdm-waterbutler:latest}"
          fi
        else
          export EMBER_IMAGE="${{ github.event.inputs.ember_image || 'niicloudoperation/rdm-ember-osf-web:latest' }}"
          export CAS_IMAGE="${{ github.event.inputs.cas_image || 'niicloudoperation/rdm-cas-overlay:latest' }}"
          export MFR_IMAGE="${{ github.event.inputs.mfr_image || 'niicloudoperation/rdm-modular-file-renderer:latest' }}"
          if [[ -n "$WB_IMAGE" ]]; then
            export WB_IMAGE
          else
            export WB_IMAGE="${{ github.event.inputs.wb_image || 'niicloudoperation/rdm-waterbutler:latest' }}"
          fi
        fi

        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        create_docker_override
        if [ "${S3_MINIO_ENABLED}" = "true" ] && [ "${S3_MIGRATION_ENABLED}" != "true" ]; then
          bash "${{ github.workspace }}/e2e-tests/.github/scripts/setup_s3_minio.sh" prepare "${PWD}"
        fi

    - name: Configure Shibboleth authentication
      if: env.SHIBBOLETH_ENABLED == 'true'
      working-directory: RDM-osf.io
      env:
        SHIBBOLETH_CAS_IMAGE: ${{ needs.build-images.outputs.shibboleth_cas_image }}
      run: python3 ../e2e-tests/.github/scripts/setup_shibboleth.py configure . --cas-image "$SHIBBOLETH_CAS_IMAGE"

    - name: Install RDM requirements
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        install_requirements
      timeout-minutes: 15

    - name: Run Django migrations
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        run_migrations
        
    - name: Enable feature flags
      if: matrix.test-group.migration_from == null
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        export FEATURE_FLAGS="ember_edit_draft_registration_page"
        enable_feature_flags

    - name: Compile translations
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        export INCLUDE_ADMIN=${{ matrix.test-group.include_admin }}
        compile_translations
        
        # Start asset services immediately after translations
        start_asset_services

    - name: Start all RDM services
      working-directory: RDM-osf.io
      run: |
        source ${{ github.workspace }}/e2e-tests/.github/scripts/setup_rdm.sh
        export INCLUDE_ADMIN=${{ matrix.test-group.include_admin }}
        start_rdm_services

    - name: Register OAuth scopes
      working-directory: RDM-osf.io
      run: |
        docker-compose run --rm web python3 -m scripts.register_oauth_scopes

    - name: Seed KAKEN Elasticsearch data
      working-directory: RDM-osf.io
      run: |
        set -xeu
        NRID_URL="https://nrid.nii.ac.jp/nrid/1000050735975.json"
        JSON_FILE=$(mktemp)
        curl -fL "$NRID_URL" -o "$JSON_FILE"
        docker cp "$JSON_FILE" "$(docker-compose ps -q web)":/tmp/kaken_seed.json
        docker cp ${{ github.workspace }}/e2e-tests/.github/scripts/seed_kaken_es.py "$(docker-compose ps -q web)":/tmp/seed_kaken_es.py
        docker-compose exec -T web python3 /tmp/seed_kaken_es.py /tmp/kaken_seed.json "$NRID_URL"
        rm "$JSON_FILE"

    - name: Initialize MinIO for S3 compatibility tests
      if: env.MINIO_ENABLED == 'true' && env.S3_MIGRATION_ENABLED != 'true'
      working-directory: e2e-tests
      run: |
        set -eu

        key_part() {
          LC_ALL=C tr -dc 'a-z0-9' < /dev/urandom | head -c 18
        }

        secret_part() {
          LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40
        }

        ACCESS_KEY_1="ci$(key_part)"
        SECRET_KEY_1="$(secret_part)"
        ACCESS_KEY_2="ci$(key_part)"
        SECRET_KEY_2="$(secret_part)"

        BUCKET_PREFIX="ci-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
        if [ "${S3_MINIO_ENABLED}" = "true" ]; then
          BUCKET_PREFIX="s3-e2e"
        fi
        BUCKET_NAME_1="${BUCKET_PREFIX}-a"
        BUCKET_NAME_2="${BUCKET_PREFIX}-b"

        export MINIO_VERIFY_LARGE_UPLOAD=true

        .github/scripts/setup_minio_buckets.sh \
          ../RDM-osf.io \
          "${MINIO_ALIAS}" \
          "${MINIO_ENDPOINT}" \
          "${MINIO_ROOT_USER}" \
          "${MINIO_ROOT_PASSWORD}" \
          "${ACCESS_KEY_1}" "${SECRET_KEY_1}" "${BUCKET_NAME_1}" \
          "${ACCESS_KEY_2}" "${SECRET_KEY_2}" "${BUCKET_NAME_2}"

        echo "S3COMPAT_ACCESS_KEY_1=${ACCESS_KEY_1}" >> $GITHUB_ENV
        echo "S3COMPAT_SECRET_KEY_1=${SECRET_KEY_1}" >> $GITHUB_ENV
        echo "S3COMPAT_ACCESS_KEY_2=${ACCESS_KEY_2}" >> $GITHUB_ENV
        echo "S3COMPAT_SECRET_KEY_2=${SECRET_KEY_2}" >> $GITHUB_ENV
        echo "S3COMPAT_BUCKET_NAME_1=${BUCKET_NAME_1}" >> $GITHUB_ENV
        echo "S3COMPAT_BUCKET_NAME_2=${BUCKET_NAME_2}" >> $GITHUB_ENV
        echo "S3COMPAT_REGION=${MINIO_REGION}" >> $GITHUB_ENV
        echo "S3COMPAT_ENDPOINT=${MINIO_ENDPOINT}" >> $GITHUB_ENV
        echo "S3COMPAT_SERVICE_NAME=${MINIO_SERVICE_NAME}" >> $GITHUB_ENV

    - name: Route Amazon S3 requests to MinIO
      if: env.S3_MINIO_ENABLED == 'true'
      working-directory: RDM-osf.io
      run: bash "${{ github.workspace }}/e2e-tests/.github/scripts/setup_s3_minio.sh" install "${PWD}"

    - name: Initialize MinIO for S3CompatSigV4 tests
      if: env.MINIO_ENABLED == 'true' && (env.S3COMPATSIGV4_ENABLED == 'true' || env.S3COMPATSIGV4_INST_ENABLED == 'true')
      working-directory: e2e-tests
      run: |
        set -eu

        key_part() {
          LC_ALL=C tr -dc 'a-z0-9' < /dev/urandom | head -c 18
        }

        secret_part() {
          LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40
        }

        BUCKET_PREFIX="ci-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-sigv4"

        if [ "${S3COMPATSIGV4_ENABLED}" = "true" ]; then
          ACCESS_KEY_1="ci$(key_part)"
          SECRET_KEY_1="$(secret_part)"
          ACCESS_KEY_2="ci$(key_part)"
          SECRET_KEY_2="$(secret_part)"

          BUCKET_NAME_1="${BUCKET_PREFIX}-a"
          BUCKET_NAME_2="${BUCKET_PREFIX}-b"

          .github/scripts/setup_minio_buckets.sh \
            ../RDM-osf.io \
            "${MINIO_ALIAS}" \
            "${MINIO_ENDPOINT}" \
            "${MINIO_ROOT_USER}" \
            "${MINIO_ROOT_PASSWORD}" \
            "${ACCESS_KEY_1}" "${SECRET_KEY_1}" "${BUCKET_NAME_1}" \
            "${ACCESS_KEY_2}" "${SECRET_KEY_2}" "${BUCKET_NAME_2}"

          echo "S3COMPATSIGV4_ACCESS_KEY_1=${ACCESS_KEY_1}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_SECRET_KEY_1=${SECRET_KEY_1}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_ACCESS_KEY_2=${ACCESS_KEY_2}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_SECRET_KEY_2=${SECRET_KEY_2}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_BUCKET_NAME_1=${BUCKET_NAME_1}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_BUCKET_NAME_2=${BUCKET_NAME_2}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_ENDPOINT=${MINIO_ENDPOINT}" >> $GITHUB_ENV
          echo "S3COMPATSIGV4_SERVICE_NAME=${MINIO_SERVICE_NAME}" >> $GITHUB_ENV
        fi

        if [ "${S3COMPATSIGV4_INST_ENABLED}" = "true" ]; then
          INST_ACCESS_KEY="ci$(key_part)"
          INST_SECRET_KEY="$(secret_part)"
          INST_BUCKET="${BUCKET_PREFIX}-inst"
          # Second bucket is required by setup_minio_buckets.sh but not used for inst storage
          INST_BUCKET_DUMMY="${BUCKET_PREFIX}-inst2"

          .github/scripts/setup_minio_buckets.sh \
            ../RDM-osf.io \
            "${MINIO_ALIAS}" \
            "${MINIO_ENDPOINT}" \
            "${MINIO_ROOT_USER}" \
            "${MINIO_ROOT_PASSWORD}" \
