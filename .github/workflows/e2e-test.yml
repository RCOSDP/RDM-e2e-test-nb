          args+=(--binderhub)
        fi
        .github/scripts/generate_ci_config.sh "${args[@]}"
        rm base_ci.config.yaml

        # Add exclude_notebooks - merge both PR body and matrix configuration
        if [ -n "$EXCLUDE_NOTEBOOKS" ] || [ -n "${{ matrix.test-group.exclude_notebooks }}" ]; then
