          export S3_MINIO_CA_BUNDLE="${GITHUB_WORKSPACE}/RDM-osf.io/.s3-minio/server.crt"
          args+=(--s3-minio)
        elif [ "${MINIO_ENABLED}" = "true" ]; then
          args+=(--minio)
