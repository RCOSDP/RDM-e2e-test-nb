<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono CJK JP</family></prefer></alias>
  <!-- Named web fonts may lack Japanese glyphs even without a generic CSS family. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <include>/etc/fonts/fonts.conf</include>
</fontconfig>
