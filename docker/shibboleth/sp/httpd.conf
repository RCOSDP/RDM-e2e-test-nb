Listen 81
ServerName 192.168.168.167
<VirtualHost *:80>
    ServerName http://192.168.168.167:18088
    UseCanonicalName On
    ProxyPreserveHost On
    Include /etc/e2e/headers.conf
    Alias /discovery/ /etc/e2e/discovery/
    <Directory /etc/e2e/discovery>
        Require all granted
    </Directory>
    ProxyPass /discovery/ !
    ProxyPass /Shibboleth.sso !
    ProxyPass / http://cas:8080/
    ProxyPassReverse / http://cas:8080/
    <Location /login>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require shib-session
    </Location>
</VirtualHost>
<VirtualHost *:81>
    ServerName http://192.168.168.167:18087
    UseCanonicalName On
    ProxyPreserveHost On
    Include /etc/e2e/headers.conf
    Alias /js/ /etc/e2e/js/
    <Directory /etc/e2e/js>
        Require all granted
    </Directory>
    ProxyPass /js/ !
    ProxyPass /Shibboleth.sso !
    ProxyPass / http://admin:8001/
    ProxyPassReverse / http://admin:8001/
    <Location /account/shib-login>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require shib-session
    </Location>
</VirtualHost>
