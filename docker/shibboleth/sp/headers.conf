# Never accept caller-supplied identity headers at the proxy boundary.
RequestHeader unset AUTH-eppn
RequestHeader unset AUTH-entitlement
RequestHeader unset AUTH-displayName
RequestHeader unset AUTH-mail
RequestHeader unset AUTH-givenName
RequestHeader unset AUTH-sn
RequestHeader unset AUTH-o
RequestHeader unset AUTH-Shib-Session-ID
RequestHeader unset AUTH-Shib-Identity-Provider
RequestHeader unset REMOTE_USER
RequestHeader set AUTH-eppn "%{eppn}e" env=eppn
RequestHeader set AUTH-entitlement "%{entitlement}e" env=entitlement
RequestHeader set AUTH-displayName "%{displayName}e" env=displayName
RequestHeader set AUTH-mail "%{mail}e" env=mail
RequestHeader set AUTH-givenName "%{givenName}e" env=givenName
RequestHeader set AUTH-sn "%{sn}e" env=sn
RequestHeader set AUTH-o "%{o}e" env=o
RequestHeader set AUTH-Shib-Session-ID "%{Shib-Session-ID}e" env=Shib-Session-ID
RequestHeader set AUTH-Shib-Identity-Provider "%{Shib-Identity-Provider}e" env=Shib-Identity-Provider
RequestHeader set REMOTE_USER "%{eppn}e" env=eppn
